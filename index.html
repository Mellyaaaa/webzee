<div class="discord-card" id="discordCard">

    <div class="discord-avatar">
        <img
            id="discordAvatar"
            src="assets/avatar.jpg"
            alt="Discord Avatar"
        >

        <span
            id="discordStatus"
            class="discord-status offline"
        ></span>
    </div>

    <div class="discord-info">

        <div class="discord-top">

            <span class="discord-label">
                DISCORD
            </span>

            <span
                id="discordStatusText"
                class="discord-online"
            >
                Offline
            </span>

        </div>

        <strong id="discordName">
            Loading...
        </strong>

        <span id="discordActivity">
            Checking presence...
        </span>

    </div>

    <i
        id="discordIcon"
        class="fa-brands fa-discord discord-icon"
    ></i>

</div>


<!-- Spotify -->
<div
    class="spotify-card hidden"
    id="spotifyCard"
>

    <img
        id="spotifyCover"
        class="spotify-cover"
        src=""
        alt="Spotify Album"
    >

    <div class="spotify-info">

        <span class="spotify-label">
            LISTENING TO SPOTIFY
        </span>

        <strong id="spotifySong">
            -
        </strong>

        <span id="spotifyArtist">
            -
        </span>

    </div>

    <div class="spotify-icon">
        <i class="fa-brands fa-spotify"></i>
    </div>

</div>


<!-- Game -->
<div
    class="game-card hidden"
    id="gameCard"
>

    <div class="game-image">

        <img
            id="gameImage"
            src=""
            alt="Game"
        >

    </div>

    <div class="game-info">

        <span class="game-label">
            PLAYING
        </span>

        <strong id="gameName">
            -
        </strong>

        <span id="gameDetails">
            -
        </span>

    </div>

</div>
